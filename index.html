function intake(){return `<section class="view active"><div class="intro"><div><span class="kicker">STRUCTURED ASSESSMENT</span><h2>${tr('intakeTitle','Clinical intake and safety gate')}</h2><p>${tr('intakeP','The system stops recommendation generation when a hard clinical constraint is unresolved.')}</p></div><span class="pill warn">CLINICIAN REVIEW REQUIRED</span></div><div class="intake"><article class="card"><ol class="steps">${[['done','1','Identity and history','Complete'],['done','2','Psychiatric state','Complete'],['active','3','Medication safety','In review'],['','4','Metabolic baseline','Pending'],['','5','Nutrition context','Pending'],['','6','Objectives and consent','Pending']].map(x=>`<li class="${x[0]}"><b>${x[1]}</b><div><strong>${x[2]}</strong><small>${x[3]}</small></div></li>`).join('')}</ol></article><article class="card"><div class="head"><div><span class="kicker">ANNA KELLER · 34</span><h3>Medication and diet interaction review</h3></div><span class="pill danger">HARD CONSTRAINT</span></div><div class="alert red"><strong>Lithium requires sodium and fluid stability.</strong><br>Rapid carbohydrate reduction can change fluid and sodium balance. Keto initiation requires a prescriber-defined monitoring plan.</div><div class="formgrid"><label><span>Medication</span><input value="Lithium carbonate"></label><label><span>Dose</span><input value="900 mg nightly"></label><label><span>Last serum level</span><input value="0.72 mmol/L"></label><label><span>Measurement date</span><input type="date" value="2026-07-10"></label></div><div class="checks">${[['checked','Prescriber identified','Dr. H. Vieli'],['','Sodium and fluid plan approved','Blocks activation'],['','Repeat lithium, sodium and renal panel scheduled','Blocks activation'],['checked','Sick-day instructions acknowledged','2026-07-15']].map(x=>`<label class="check"><input type="checkbox" ${x[0]}><span><strong>${x[1]}</strong><small>${x[2]}</small></span></label>`).join('')}</div></article></div></section>`}
function biomarkers(){const cards=[['flag','Sodium','134','mmol/L','Reference 135–145'],['','HbA1c','5.8','%','Glucose regulation'],['','ApoB','1.09','g/L','Clinic target <0.80'],['','HOMA-IR','3.1','','Moderate confidence'],['','25-OH Vitamin D','54','nmol/L','Insufficient'],['','eGFR','88','mL/min','Stable']];return `<section class="view active"><div class="intro"><div><span class="kicker">ANNA KELLER · BH-0041</span><h2>${tr('bioTitle','Biomarkers and measured treatment domains')}</h2><p>${tr('bioP','Laboratory results retain source, method, date, fasting status and clinical context.')}</p></div>${btn('Review plan','nutrition')}</div><div class="alert amber"><strong>Sodium trend requires review.</strong><br>137 → 134 mmol/L over six days. The value is not interpreted in isolation because lithium exposure and dietary transition change the risk context.</div><div class="bio">${cards.map(x=>`<article class="${x[0]}"><span>${x[1]}</span><small>Serum · 2026-07-16</small><strong>${x[2]} <em>${x[3]}</em></strong><footer>${x[4]}</footer></article>`).join('')}</div><div class="grid2"><article class="card"><span class="kicker">STATE MODEL</span><div class="head"><h3>Measured treatment domains</h3><span class="pill neutral">Not a diagnosis</span></div>${[['Glucose regulation','Priority','warn'],['Atherogenic lipid burden','Priority','warn'],['Renal and electrolyte safety','Review','danger'],['Micronutrient sufficiency','Correct','warn'],['Energy availability','Adequate','success']].map(x=>`<div class="q"><span></span><strong>${x[0]}</strong><span class="pill ${x[2]}">${x[1]}</span></div>`).join('')}</article><article class="card"><span class="kicker">DATA QUALITY</span><h3>Measurement confidence</h3><div class="metric" style="margin-top:15px"><strong>87%</strong><span>High-confidence baseline</span></div><p style="font-size:10px;line-height:1.8;color:var(--muted)">✓ Fasting status confirmed<br>✓ Laboratory and method recorded<br>✓ Medication timing recorded<br>○ Acute illness status missing</p></article></div></section>`}
function nutrition(){return `<section class="view active"><div class="intro"><div><span class="kicker">ANNA KELLER · PLAN V0.7</span><h2>${tr('nutritionTitle','Adaptive nutrition prescription')}</h2><p>${tr('nutritionP','A constraint-based plan balancing psychiatric stability, metabolic correction, nutrient adequacy and adherence.')}</p></div><button class="btn" id="approve">Approve plan</button></div><div class="target">${[['Energy','1,950','kcal/day'],['Protein','105 g','1.5 g/kg'],['Net carbohydrate','35 g','initiation range'],['Fibre','28 g','minimum']].map(x=>`<article><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></article>`).join('')}</div><div class="grid2"><article class="card"><div class="head"><div><span class="kicker">DAY PLAN · WEDNESDAY</span><h3>Meals with verified composition</h3></div><button class="btn alt" id="swap">Equivalent day</button></div><div id="meals"></div></article><aside class="card"><span class="kicker">CLINICAL RATIONALE</span><h3>Why this plan was generated</h3>${[['a','A','Nutrient adequacy','Food combinations satisfy defined micronutrient minimums before preferences are optimized.'],['','B','Metabolic correction','Carbohydrate exposure and fat quality reflect insulin resistance and ApoB monitoring.'],['','B','Therapeutic ketosis','Ketosis is a monitored intervention variable, not proof of psychiatric response.']].map(x=>`<div class="rationale"><span class="grade ${x[0]}">${x[1]}</span><div><strong>${x[2]}</strong><p>${x[3]}</p></div></div>`).join('')}<div class="alert gray"><strong>Hard constraints applied.</strong><br>Lithium safety, sodium stability, allergy exclusions and minimum protein cannot be overridden by meal preference.</div></aside></div></section>`}
function renderMeals(){document.querySelector('#meals').innerHTML=meals[mealSet].map(x=>`<div class="meal"><time>${x[0]}</time><div><h4>${x[1]}</h4><p>${x[2]}</p></div><div class="mac"><span>${x[3]}</span><span>${x[4]}</span><span>${x[5]}</span></div></div>`).join('')}
function keto(){return `<section class="view active"><div class="intro"><div><span class="kicker">CLINICIAN-SUPERVISED MODULE</span><h2>${tr('ketoTitle','Ketogenic metabolic therapy')}</h2><p>${tr('ketoP','A gated adjunctive protocol for psychiatric and metabolic outcomes.')}</p></div><span class="pill warn">NOT ACTIVATED</span></div><div class="grid2"><article class="card"><div class="head"><div><span class="kicker">PROTOCOL PATH</span><h3>Current phase: readiness</h3></div><strong>62%</strong></div><ol class="timeline">${[['done','1','Eligibility screening','Complete'],['active','2','Baseline and safety plan','3 / 5 requirements'],['','3','Initiation','7–14 days'],['','4','Stabilization','Weeks 3–8'],['','5','Response evaluation','Week 8+']].map(x=>`<li class="${x[0]}"><b>${x[1]}</b><div><strong>${x[2]}</strong><small>${x[3]}</small></div></li>`).join('')}</ol></article><article class="card"><div class="head"><div><span class="kicker">READINESS GATE</span><h3>Eligibility and constraints</h3></div><span class="pill danger">2 blockers</span></div>${[['','✓','Diagnosis and current state reviewed','Bipolar I · no current mania or psychosis'],['','✓','Eating-disorder screen completed','No active restrictive or binge-purge disorder'],['block','!','Electrolyte trend unresolved','Sodium 134 mmol/L'],['block','!','Medication monitoring plan incomplete','Lithium repeat measurement not scheduled'],['','✓','Nutrition professional assigned','Clinical dietitian · pilot team']].map(x=>`<div class="gate ${x[0]}"><b>${x[1]}</b><div><strong>${x[2]}</strong><small>${x[3]}</small></div></div>`).join('')}</article></div><div class="grid2" style="margin-top:16px"><article class="card"><span class="kicker">DAILY MONITORING</span><h3>Blood βHB · glucose · hydration · GI tolerance · sleep · mood activation · medication adherence</h3></article><article class="card"><span class="kicker">STOP AND REVIEW</span><p style="font-size:10px;line-height:1.8;color:var(--muted)">Acute psychiatric deterioration · inability to hydrate · hypoglycaemia · symptomatic hypotension · medication toxicity concern · significant electrolyte or renal change</p></article></div></section>`}
function outcomes(){return `<section class="view active"><div class="intro"><div><span class="kicker">LONGITUDINAL RESPONSE · ANNA KELLER</span><h2>${tr('outTitle','Metabolic and psychiatric outcomes')}</h2><p>${tr('outP','Response is evaluated across domains. No single biomarker or symptom score defines success.')}</p></div></div><div class="outcomes">${[['CGI-S','4.0 → 3.2',[80,76,70,63,58]],['HOMA-IR','3.8 → 3.1',[82,79,71,69,61]],['Sleep duration','6.4 → 7.2 h',[50,57,62,69,76]],['Waist','94 → 90 cm',[84,82,79,74,70]]].map(x=>`<article class="card outcome"><span>${x[0]}</span><strong>${x[1]}</strong><div class="bars">${x[2].map(h=>`<i style="height:${h}%"></i>`).join('')}</div></article>`).join('')}</div><article class="card" style="margin-top:16px"><span class="kicker">CLINICAL TIMELINE</span><h3>Interventions, exposures and outcomes</h3>${[['21 May','Baseline completed','Metabolic panel, CGI-S, sleep and dietary history'],['28 May','Medication-aware plan started','Carbohydrate quality, protein distribution and fibre'],['18 Jun','Wearable activity integrated','Energy target increased on strength days'],['10 Jul','Repeat labs completed','HbA1c and HOMA-IR improved; ApoB unchanged'],['16 Jul','Sodium decline detected','Keto initiation held pending clinical review']].map(x=>`<div class="q"><time>${x[0]}</time><div><strong>${x[1]}</strong><small>${x[2]}</small></div><span></span></div>`).join('')}</article></section>`}
function evidence(){return `<section class="view active"><div class="intro"><div><span class="kicker">KNOWLEDGE SYSTEM</span><h2>${tr('evTitle','Evidence register and decision traceability')}</h2><p>${tr('evP','Every rule is versioned, graded and restricted to a defined clinical use.')}</p></div></div><div class="evidence">${[['B','KETO-PSY-001 · v1.0','Adjunctive ketogenic therapy in serious mental illness','Supports structured psychiatric and metabolic monitoring in eligible adults. It does not establish individual efficacy or support medication withdrawal.','Sethi et al., Psychiatry Research, 2024'],['A','SAFE-LI-002 · v1.0','Lithium requires stable sodium and fluid balance','Dietary transitions that change fluid or sodium balance require prescriber review, patient education and planned laboratory monitoring.','Medication-safety rule · clinic validation required'],['A','NUTR-ADEQ-001 · v1.1','Nutrient adequacy precedes preference optimization','Meal generation satisfies nutrient, allergy, medication and disease constraints before cost, variety and preference are optimized.','Swiss and European reference configuration'],['B','WEAR-SLEEP-003 · v0.8','Wearable sleep data are longitudinal trends','Sleep duration and timing may inform adaptation after repeated measurements. Consumer sleep-stage estimates do not trigger treatment decisions.','Device-specific validation register']].map(x=>`<article class="card ev"><span class="grade ${x[0]==='A'?'a':''}">${x[0]}</span><div><span class="kicker">${x[1]}</span><h3>${x[2]}</h3><p>${x[3]}</p><footer>${x[4]}</footer></div></article>`).join('')}</div></section>`}
const views={overview,patients:patientView,intake,biomarkers,nutrition,keto,outcomes,evidence};function render(){document.querySelector('#app').innerHTML=views[view]();document.querySelector('#title').textContent=navItems.find(x=>x[0]===view)[lang==='de'?2:1];document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;renderNav();render()});if(view==='patients'){renderRows();document.querySelector('#search').oninput=e=>renderRows(e.target.value)}if(view==='nutrition'){renderMeals();document.querySelector('#swap').onclick=()=>{mealSet=(mealSet+1)%2;renderMeals();toast('Equivalent day generated within current constraints.')};document.querySelector('#approve').onclick=()=>toast('Prototype approval recorded.')}document.querySelectorAll('.btn:not([data-view])').forEach(b=>b.onclick=()=>toast('Prototype action recorded.'))}function renderNav(){document.querySelector('#nav').innerHTML=navItems.map(x=>`<button class="${view===x[0]?'active':''}" data-v="${x[0]}">${x[lang==='de'?2:1]}</button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;renderNav();render()})}function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}document.querySelector('#lang').onclick=()=>{lang=lang==='en'?'de':'en';document.querySelector('#lang').textContent=lang==='en'?'DE':'EN';renderNav();render()};document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-role]').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast(b.dataset.role==='patient'?'Patient workspace is the next vertical slice.':'Clinician workspace active.')});renderNav();render();
</script></body></html>
